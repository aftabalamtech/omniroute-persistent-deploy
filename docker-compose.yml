services:
  omniroute:
    build: .
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      PORT: ${PORT:-20128}
    ports:
      - "${PORT:-20128}:20128"
    volumes:
      - omniroute-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:20128/api/monitoring/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

volumes:
  omniroute-data:
