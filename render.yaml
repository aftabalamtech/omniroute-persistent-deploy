services:
  - type: web
    name: omniroute-render
    runtime: docker
    branch: render
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    numInstances: 1
    healthCheckPath: /api/monitoring/health
    maxShutdownDelaySeconds: 30
    envVars:
      - key: DATA_DIR
        value: /app/data
      - key: HOSTNAME
        value: 0.0.0.0
      - key: PORT
        value: "10000"
      - key: NODE_ENV
        value: production
      - key: OMNIROUTE_DB_FILENAME
        value: storage.sqlite
      - key: GITHUB_BACKUP_ENABLED
        value: "true"
      - key: GITHUB_BACKUP_REPO
        value: aftabalamtech/omniroute-backup
      - key: GITHUB_BACKUP_BRANCH
        value: main
      - key: GITHUB_BACKUP_FILE
        value: latest.db.zst
      - key: BACKUP_INTERVAL_MINUTES
        value: "5"
      - key: MAX_BACKUP_BYTES
        value: "94371840"
      - key: JWT_SECRET
        sync: false
      - key: API_KEY_SECRET
        sync: false
      - key: STORAGE_ENCRYPTION_KEY
        sync: false
      - key: STORAGE_ENCRYPTION_KEY_VERSION
        value: v1
      - key: INITIAL_PASSWORD
        sync: false
      - key: GITHUB_TOKEN
        sync: false
